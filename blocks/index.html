<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 汪汪队英语乐园 - Paw Patrol English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', '幼圆', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .theme-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .theme-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 4px solid transparent;
        }
        
        .theme-card:hover {
            transform: translateY(-10px);
            border-color: #ffd700;
        }
        
        .theme-card.active {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
        
        .theme-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .theme-name {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .theme-count {
            color: #666;
            font-size: 1em;
        }
        
        .word-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .word-grid.active {
            display: grid;
        }
        
        .word-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid transparent;
        }
        
        .word-card:hover {
            transform: scale(1.05);
            border-color: #4ecdc4;
        }
        
        .word-emoji {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .word-en {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .word-zh {
            color: #666;
            font-size: 1em;
        }
        
        .play-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            background: #ff5252;
        }
        
        .play-btn.playing {
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            color: white;
        }
        
        .paw-print {
            position: fixed;
            font-size: 2em;
            opacity: 0.1;
            z-index: -1;
            animation: float 3s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐾 汪汪队英语乐园</h1>
            <p class="subtitle">Paw Patrol English Learning Game</p>
            <p style="margin-top: 10px; font-size: 0.9em;">点击单词卡片听发音 | Click to hear pronunciation</p>
        </header>
        
        <div class="theme-selector" id="themeSelector">
            <!-- Themes will be loaded here -->
        </div>
        
        <div id="wordContainer">
            <!-- Words will be loaded here -->
        </div>
        
        <div class="progress-bar">
            <span id="progressText">选择主题开始学习 | Select a theme to start</span>
        </div>
    </div>
    
    <div class="play-btn" id="globalPlayBtn" title="随机播放 | Random Play">
        🎲
    </div>
    
    <script>
        // 词汇数据（根据实际音频文件调整）
        const vocabulary = {

                {en: 'White', zh: '白色', emoji: '⚪'},

                {en: 'Light Blue', zh: '浅蓝色', emoji: '💎'},

            ],
            numbers: [
                {en: 'Eleven', zh: '十一', emoji: '1️⃣1️⃣'},
                {en: 'Twelve', zh: '十二', emoji: '1️⃣2️⃣'},
                {en: 'Thirteen', zh: '十三', emoji: '1️⃣3️⃣'},
                {en: 'Fourteen', zh: '十四', emoji: '1️⃣4️⃣'},
                {en: 'Fifteen', zh: '十五', emoji: '1️⃣5️⃣'},
                {en: 'Sixteen', zh: '十六', emoji: '1️⃣6️⃣'},
                {en: 'Seventeen', zh: '十七', emoji: '1️⃣7️⃣'},
                {en: 'Eighteen', zh: '十八', emoji: '1️⃣8️⃣'},
                {en: 'Nineteen', zh: '十九', emoji: '1️⃣9️⃣'},
                {en: 'Twenty', zh: '二十', emoji: '2️⃣0️⃣'},
                {en: 'Thirty', zh: '三十', emoji: '3️⃣0️⃣'},

            ],

                {en: 'Mouth', zh: '嘴巴', emoji: '👄'},

            ],
            vehicles: [
                {en: 'Bicycle', zh: '自行车', emoji: '🚲'},
                {en: 'Motorcycle', zh: '摩托车', emoji: '🏍️'},
                {en: 'Airplane', zh: '飞机', emoji: '✈️'},

                {en: 'Boat', zh: '小船', emoji: '⛵'}
            ],
            food: [
                {en: 'Rice', zh: '米饭', emoji: '🍚'},
                {en: 'Noodles', zh: '面条', emoji: '🍜'},
                {en: 'Soup', zh: '汤', emoji: '🍲'},
                {en: 'Salad', zh: '沙拉', emoji: '🥗'},
                {en: 'Cake', zh: '蛋糕', emoji: '🍰'},
                {en: 'Cookie', zh: '饼干', emoji: '🍪'},
                {en: 'Ice Cream', zh: '冰淇淋', emoji: '🍦'},
                {en: 'Pizza', zh: '披萨', emoji: '🍕'},
                {en: 'Hamburger', zh: '汉堡', emoji: '🍔'},
                {en: 'French Fries', zh: '薯条', emoji: '🍟'},
                {en: 'Chicken', zh: '鸡肉', emoji: '🍗'},
                {en: 'Fish', zh: '鱼肉', emoji: '🐟'}
            ],
            family: [
                {en: 'Grandma', zh: '奶奶', emoji: '👵'},
                {en: 'Grandpa', zh: '爷爷', emoji: '👴'},
                {en: 'Aunt', zh: '阿姨', emoji: '👩'},
                {en: 'Uncle', zh: '叔叔', emoji: '👨'},
                {en: 'Cousin', zh: '堂兄弟/姐妹', emoji: '👫'},
                {en: 'Baby', zh: '宝宝', emoji: '👶'},
                {en: 'Sister', zh: '姐妹', emoji: '👧'},
                {en: 'Brother', zh: '兄弟', emoji: '👦'},
                {en: 'Parents', zh: '父母', emoji: '👨‍👩‍👧'},
                {en: 'Children', zh: '孩子们', emoji: '👨‍👩‍👧‍👦'},
                {en: 'Family', zh: '家庭', emoji: '🏠'},
                {en: 'Pet', zh: '宠物', emoji: '🐶'},
                {en: 'Friend', zh: '朋友', emoji: '👭'},
                {en: 'Teacher', zh: '老师', emoji: '👩‍🏫'}
            ]
        };
        
        const themeInfo = {
            animals: {icon: '🐾', name: '动物乐园', count: 3},
            fruits: {icon: '🍎', name: '水果世界', count: 3},
            colors: {icon: '🎨', name: '颜色认知', count: 12},
            numbers: {icon: '🔢', name: '数字学习', count: 12},
            body: {icon: '👤', name: '身体部位', count: 12},
            vehicles: {icon: '🚗', name: '交通工具', count: 12},
            food: {icon: '🍔', name: '美食天地', count: 12},
            family: {icon: '👨‍👩‍👧‍👦', name: '家庭成员', count: 14}
        };
        
        let currentTheme = null;
        let isPlaying = false;
        
        // 初始化主题选择器
        function initThemes() {
            const container = document.getElementById('themeSelector');
            container.innerHTML = '';
            
            for (const [key, info] of Object.entries(themeInfo)) {
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.innerHTML = `
                    <div class="theme-icon">${info.icon}</div>
                    <div class="theme-name">${info.name}</div>
                    <div class="theme-count">${info.count} 个单词</div>
                `;
                card.onclick = () => selectTheme(key);
                container.appendChild(card);
            }
        }
        
        // 选择主题
        function selectTheme(theme) {
            currentTheme = theme;
            
            // 更新选中状态
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // 加载单词
            loadWords(theme);
            
            // 更新进度
            document.getElementById('progressText').textContent = 
                `当前主题：${themeInfo[theme].name} | ${vocabulary[theme].length} 个单词`;
        }
        
        // 加载单词卡片
        function loadWords(theme) {
            const container = document.getElementById('wordContainer');
            container.innerHTML = '';
            
            const wordGrid = document.createElement('div');
            wordGrid.className = 'word-grid active';
            
            vocabulary[theme].forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word-emoji">${word.emoji}</div>
                    <div class="word-en">${word.en}</div>
                    <div class="word-zh">${word.zh}</div>
                `;
                card.onclick = () => playWord(theme, word.en, index);
                wordGrid.appendChild(card);
            });
            
            container.appendChild(wordGrid);
        }
        
        // 播放单词发音
        function playWord(theme, word, index) {
            if (isPlaying) return;
            
            const audioFile = `audios/${theme}_${word.toLowerCase().replace(/\s+/g, '_')}.wav`;
            const audio = new Audio(audioFile);
            
            isPlaying = true;
            const btn = document.querySelector('.play-btn');
            btn.classList.add('playing');
            
            audio.onended = () => {
                isPlaying = false;
                btn.classList.remove('playing');
            };
            
            audio.onerror = () => {
                console.error('Audio file not found:', audioFile);
                alert(`音频文件未找到：${audioFile}`);
                isPlaying = false;
                btn.classList.remove('playing');
            };
            
            audio.play();
        }
        
        // 随机播放
        document.getElementById('globalPlayBtn').onclick = () => {
            if (!currentTheme) {
                alert('请先选择一个主题！| Please select a theme first!');
                return;
            }
            
            const words = vocabulary[currentTheme];
            const randomIndex = Math.floor(Math.random() * words.length);
            const randomWord = words[randomIndex];
            
            playWord(currentTheme, randomWord.en, randomIndex);
        };
        
        // 创建漂浮的爪印装饰
        function createPawPrints() {
            for (let i = 0; i < 10; i++) {
                const paw = document.createElement('div');
                paw.className = 'paw-print';
                paw.textContent = '🐾';
                paw.style.left = Math.random() * 100 + '%';
                paw.style.top = Math.random() * 100 + '%';
                paw.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(paw);
            }
        }
        
        // 页面加载完成
        window.onload = () => {
            initThemes();
            createPawPrints();
        };
    </script>
</body>
</html>
