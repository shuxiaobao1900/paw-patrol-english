<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汪汪队英语大冒险 - Paw Patrol English Adventure</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #FF6B6B;
            text-align: center;
            margin-bottom: 30px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .theme-card {
            background: linear-gradient(135deg, #A3E4D7 0%, #76D7C4 100%);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s;
            color: white;
            text-align: center;
        }
        .theme-card:hover {
            transform: translateY(-5px);
        }
        .theme-card h3 {
            margin: 0 0 10px 0;
        }
        .word-view {
            display: none;
        }
        .word-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
        }
        .word-card h2 {
            font-size: 3rem;
            margin: 0 0 10px 0;
        }
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .back-btn {
            background: #FF6B6B;
        }
        .back-btn:hover {
            background: #FF5252;
        }
        .progress {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 汪汪队英语大冒险</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            欢迎来到汪汪队的英语世界！这里有 9 个有趣的单词等着你来探索！
        </p>
        
        <div id="themeGrid" class="theme-grid">
            <!-- 主题卡片动态生成 -->
        </div>
        
        <div id="wordView" class="word-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="currentTheme">主题名称</h2>
                <button class="back-btn" onclick="goHome()">🏠 返回主页</button>
            </div>
            
            <div class="word-card">
                <h2 id="currentWord">Hello</h2>
                <p id="currentTranslation">你好</p>
            </div>
            
            <div class="controls">
                <button onclick="playEnglish()">🔊 英语发音</button>
                <button onclick="playChinese()" style="background: #2196F3;">🔊 中文发音</button>
            </div>
            
            <div class="controls">
                <button onclick="prevWord()" id="prevBtn">⬅️ 上一个</button>
                <button onclick="nextWord()" id="nextBtn">➡️ 下一个</button>
            </div>
            
            <div class="progress">
                <div id="progressText">进度: 1/10</div>
            </div>
        </div>
    </div>
    
    <script>
        // 单词数据
        const wordsData = [{"name": "动物世界", "category": "animals", "description": "认识可爱的小动物们", "words": [{"english": "dog", "chinese": "小狗"}, {"english": "cat", "chinese": "小猫"}, {"english": "rabbit", "chinese": "兔子"}]}, {"name": "多彩颜色", "category": "colors", "description": "学习各种漂亮的颜色", "words": [{"english": "red", "chinese": "红色"}, {"english": "blue", "chinese": "蓝色"}, {"english": "yellow", "chinese": "黄色"}]}, {"name": "美味食物", "category": "food", "description": "各种好吃的东西", "words": [{"english": "apple", "chinese": "苹果"}, {"english": "banana", "chinese": "香蕉"}, {"english": "cake", "chinese": "蛋糕"}]}];
        
        let currentThemeIndex = -1;
        let currentWordIndex = 0;
        let currentWords = [];
        
        // 初始化主题
        function initThemes() {
            const themeGrid = document.getElementById('themeGrid');
            themeGrid.innerHTML = '';
            
            wordsData.forEach((theme, index) => {
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.innerHTML = `
                    <h3>${theme.name}</h3>
                    <p>${theme.description || '快来学习吧！'}</p>
                    <p><strong>${theme.words.length} 个单词</strong></p>
                `;
                card.onclick = () => selectTheme(index);
                themeGrid.appendChild(card);
            });
        }
        
        // 选择主题
        function selectTheme(index) {
            currentThemeIndex = index;
            currentWordIndex = 0;
            currentWords = wordsData[index].words;
            
            document.getElementById('themeGrid').style.display = 'none';
            document.getElementById('wordView').style.display = 'block';
            document.getElementById('currentTheme').textContent = wordsData[index].name;
            
            updateWordDisplay();
        }
        
        // 返回主页
        function goHome() {
            document.getElementById('themeGrid').style.display = 'grid';
            document.getElementById('wordView').style.display = 'none';
        }
        
        // 更新单词显示
        function updateWordDisplay() {
            if (currentWords.length === 0) return;
            
            const word = currentWords[currentWordIndex];
            document.getElementById('currentWord').textContent = word.english;
            document.getElementById('currentTranslation').textContent = word.chinese;
            
            document.getElementById('progressText').textContent = 
                `进度: ${currentWordIndex + 1}/${currentWords.length}`;
            
            document.getElementById('prevBtn').disabled = currentWordIndex === 0;
            document.getElementById('nextBtn').disabled = currentWordIndex === currentWords.length - 1;
            
            // 自动播放英语发音
            setTimeout(() => playEnglish(), 300);
        }
        
        // 播放英语发音
        function playEnglish() {
            if (currentWords.length === 0) return;
            const word = currentWords[currentWordIndex];
            speak(word.english, 'en-US', 1.0, 1.2);
        }
        
        // 播放中文发音
        function playChinese() {
            if (currentWords.length === 0) return;
            const word = currentWords[currentWordIndex];
            speak(word.chinese, 'zh-CN', 0.9, 1.1);
        }
        
        // 语音合成
        function speak(text, lang, rate, pitch) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.pitch = pitch;
                utterance.volume = 1.0;
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能，请使用 Chrome 或 Edge 浏览器。');
            }
        }
        
        // 上一个单词
        function prevWord() {
            if (currentWordIndex > 0) {
                currentWordIndex--;
                updateWordDisplay();
            }
        }
        
        // 下一个单词
        function nextWord() {
            if (currentWordIndex < currentWords.length - 1) {
                currentWordIndex++;
                updateWordDisplay();
            }
        }
        
        // 初始化
        window.onload = function() {
            initThemes();
            if ('speechSynthesis' in window) {
                speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
