<html lang="zh-CN">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', '幼圆', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        /* 主页：主题选择 */
        .theme-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .theme-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 4px solid transparent;
        }
        
        .theme-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }
        
        .theme-card.active {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
        
        .theme-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .theme-name {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 5px;
        }
        
        .theme-count {
            color: #666;
            font-size: 0.9em;
        }
        
        /* 导航栏 */
        .navbar {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .navbar.active {
            display: flex;
        }
        
        .navbar-title {
            font-size: 1.2em;
            color: #333;
            font-weight: bold;
        }
        
        .back-btn {

            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        /* 单词网格 - 显示所有单词卡片 */
        .word-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));

            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .word-grid.active {
            display: grid;
        }
        
        .word-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        
        .word-card:hover {
            transform: scale(1.05);
            border-color: #4ecdc4;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
        }
        
        .word-card.playing {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            animation: pulse 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        .word-emoji {
            font-size: 2.5em;
            margin-bottom: 8px;
            display: block;
        }
        
        .word-en {
            font-size: 1.2em;
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        
        .word-zh {
            color: #666;
            font-size: 0.9em;
            display: block;
        }

        .control-bar {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 15px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            gap: 15px;
            align-items: center;
        }
        
        .control-bar.active {
            display: flex;
        }
        
        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }
        
        .progress-text {
            font-size: 1em;
            color: #666;
            white-space: nowrap;
        }

        .pagination {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-bottom: 80px;
        }
        
        .pagination.active {
            display: flex;
        }
        
        .page-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .page-btn.active {
            background: #667eea;
            color: white;
        }

            h1 {
                font-size: 1.6em;
            }
            .theme-selector {

            }
            .word-grid {

                padding: 15px;
            }
            .word-emoji {

            }
            .word-en {
                font-size: 1em;
            }
            .control-bar {
                padding: 10px 15px;
                bottom: 10px;
            }
        }
        
        .total-counter {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.1em;
            opacity: 0.9;
        }
    </style>
</head>

: "Rectangle", "zh": "长方形", "emoji": "📏"}, {"en": "Star", "zh": "星星", "emoji": "⭐"}, {"en": "Heart", "zh": "心形", "emoji": "❤️"}], "weather": [{"en": "Sunny", "zh": "晴天", "emoji": "☀️"}, {"en": "Rainy", "zh": "雨天", "emoji": "🌧️"}, {"en": "Cloudy", "zh": "多云", "emoji": "☁️"}, {"en": "Wind", "zh": "风", "emoji": "💨"}, {"en": "Snow", "zh": "雪", "emoji": "❄️"}, {"en": "Rainbow", "zh": "彩虹", "emoji": "🌈"}], "seasons": [{"en": "Spring", "zh": "春天", "emoji": "🌸"}, {"en": "Summer", "zh": "夏天", "emoji": "☀️"}, {"en": "Autumn", "zh": "秋天", "emoji": "🍂"}, {"en": "Winter", "zh": "冬天", "emoji": "❄️"}], "directions": [{"en": "Up", "zh": "上", "emoji": "⬆️"}, {"en": "Down", "zh": "下", "emoji": "⬇️"}, {"en": "Left", "zh": "左", "emoji": "⬅️"}, {"en": "Right", "zh": "右", "emoji": "➡️"}, {"en": "Front", "zh": "前", "emoji": "👉"}, {"en": "Back", "zh": "后", "emoji": "👈"}], "clothes": [{"en": "T-shirt", "zh": "T恤", "emoji": "👕"}, {"en": "Shirt", "zh": "衬衫", "emoji": "👔"}, {"en": "Pants", "zh": "裤子", "emoji": "👖"}, {"en": "Shorts", "zh": "短裤", "emoji": "🩳"}, {"en": "Dress", "zh": "连衣裙", "emoji": "👗"}, {"en": "Skirt", "zh": "短裙", "emoji": "👗"}, {"en": "Sock", "zh": "袜子", "emoji": "🧦"}, {"en": "Shoe", "zh": "鞋子", "emoji": "👟"}, {"en": "Hat", "zh": "帽子", "emoji": "🎩"}, {"en": "Coat", "zh": "外套", "emoji": "🧥"}, {"en": "Jacket", "zh": "夹克", "emoji": "🧥"}, {"en": "Sweater", "zh": "毛衣", "emoji": "🧶"}], "school": [{"en": "Book", "zh": "书", "emoji": "📖"}, {"en": "Pen", "zh": "钢笔", "emoji": "🖋️"}, {"en": "Pencil", "zh": "铅笔", "emoji": "✏️"}, {"en": "Ruler", "zh": "尺子", "emoji": "📏"}, {"en": "Eraser", "zh": "橡皮", "emoji": "🧽"}, {"en": "Bag", "zh": "书包", "emoji": "🎒"}, {"en": "Box", "zh": "盒子", "emoji": "📦"}, {"en": "Desk", "zh": "桌子", "emoji": "🪑"}, {"en": "Chair", "zh": "椅子", "emoji": "🪑"}, {"en": "School", "zh": "学校", "emoji": "🏫"}, {"en": "Teacher", "zh": "老师", "emoji": "👩‍🏫"}, {"en": "Student", "zh": "学生", "emoji": "👨‍🎓"}], "places": [{"en": "Home", "zh": "家", "emoji": "🏠"}, {"en": "School", "zh": "学校", "emoji": "🏫"}, {"en": "Park", "zh": "公园", "emoji": "🏞️"}, {"en": "Zoo", "zh": "动物园", "emoji": "🦓"}, {"en": "Store", "zh": "商店", "emoji": "🛍️"}, {"en": "Hospital", "zh": "医院", "emoji": "🏥"}, {"en": "Restaurant", "zh": "餐厅", "emoji": "🍽️"}, {"en": "Library", "zh": "图书馆", "emoji": "📚"}, {"en": "Garden", "zh": "花园", "emoji": "🌻"}, {"en": "Playground", "zh": "操场", "emoji": "🏟️"}]};
        
        let currentTheme = null;
        let currentWords = [];
        let currentPage = 1;
        let itemsPerPage = 24;
        let totalPages = 1;
        let isPlaying = false;
        
        // 主题图标映射
        const themeIcons = {
            animals: '🐾',
            fruits: '🍎',
            vegetables: '🥕',
            colors: '🎨',
            numbers: '🔢',
            body: '👤',
            vehicles: '🚗',
            food: '🍔',
            drinks: '🥤',
            toys: '🧸',
            family: '👨‍👩‍👧‍👦',
            shapes: '🔶',
            weather: '☀️',
            seasons: '🍂',
            directions: '🧭',
            clothes: '👕',
            school: '🏫',
            places: '📍'
        };
        
        // 主题中文名称
        const themeNames = {
            animals: '动物世界',
            fruits: '水果大全',
            vegetables: '蔬菜园',
            colors: '颜色认知',
            numbers: '数字学习',
            body: '身体部位',
            vehicles: '交通工具',
            food: '美食天地',
            drinks: '饮品饮料',
            toys: '玩具乐园',
            family: '家庭成员',
            shapes: '形状图形',
            weather: '天气变化',
            seasons: '四季变化',
            directions: '方位方向',
            clothes: '衣物服饰',
            school: '学校用品',
            places: '场所地点'
        };
        
        // 初始化主题选择器
        function initThemes() {
            const container = document.getElementById('themeSelector');
            container.innerHTML = '';
            
            for (const [key, words] of Object.entries(vocabulary)) {
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.innerHTML = `
                    <div class="theme-icon">${themeIcons[key] || '📁'}</div>
                    <div class="theme-name">${themeNames[key] || key}</div>
                    <div class="theme-count">${words.length} 个单词</div>
                `;
                card.onclick = () => selectTheme(key);
                container.appendChild(card);
            }
        }
        
        // 选择主题
        function selectTheme(theme) {
            currentTheme = theme;
            currentWords = vocabulary[theme];
            currentPage = 1;
            totalPages = Math.ceil(currentWords.length / itemsPerPage);
            
            // 切换页面显示
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('navbar').classList.add('active');
            document.getElementById('wordGrid').classList.add('active');
            document.getElementById('controlBar').classList.add('active');
            document.getElementById('pagination').classList.add('active');
            
            // 更新导航标题
            document.getElementById('navbarTitle').textContent = themeNames[theme];
            
            // 加载当前页单词
            loadCurrentPage();
        }
        
        // 返回主页
        function goHome() {
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('navbar').classList.remove('active');
            document.getElementById('wordGrid').classList.remove('active');
            document.getElementById('controlBar').classList.remove('active');
            document.getElementById('pagination').classList.remove('active');
            currentTheme = null;
        }
        
        // 加载当前页
        function loadCurrentPage() {
            const container = document.getElementById('wordGrid');
            container.innerHTML = '';
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageWords = currentWords.slice(start, end);
            
            pageWords.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <span class="word-emoji">${word.emoji}</span>
                    <span class="word-en">${word.en}</span>
                    <span class="word-zh">${word.zh}</span>
                `;
                card.onclick = () => playWord(word);
                container.appendChild(card);
            });
            
            // 更新分页
            updatePagination();
            // 更新页码进度
            document.getElementById('pageProgress').textContent = `${currentPage} / ${totalPages}`;
            // 更新按钮状态
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
        }
        
        // 更新分页按钮
        function updatePagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    loadCurrentPage();
                };
                container.appendChild(btn);
            }
        }
        
        // 上一页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadCurrentPage();
            }
        }
        
        // 下一页
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadCurrentPage();
            }
        }
        
        // 播放单词发音
        function playWord(word) {
            if (isPlaying) return;
            
            // 高亮当前卡片
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => card.classList.remove('playing'));
            event.currentTarget.classList.add('playing');
            
            const audioFile = `audios/${currentTheme}_${word.en.toLowerCase().replace(/\s+/g, '_')}.wav`;
            const audio = new Audio(audioFile);
            
            isPlaying = true;
            audio.onended = () => {
                isPlaying = false;
                event.currentTarget.classList.remove('playing');
            };
            
            audio.onerror = () => {
                console.error('音频文件未找到:', audioFile);
                alert(`音频文件未找到：\n${audioFile}\n\n可能该单词还未生成音频`);
                isPlaying = false;
                event.currentTarget.classList.remove('playing');
            };
            
            audio.play();
        }
        
        // 顺序播放当前页所有单词
        function playAll() {
            if (isPlaying) return;
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageWords = currentWords.slice(start, end);
            
            let index = 0;
            isPlaying = true;
            
            function playNext() {
                if (index >= pageWords.length) {
                    isPlaying = false;
                    const cards = document.querySelectorAll('.word-card');
                    cards.forEach(card => card.classList.remove('playing'));
                    return;
                }
                
                const word = pageWords[index];
                const cards = document.querySelectorAll('.word-card');
                cards.forEach(card => card.classList.remove('playing'));
                cards[index].classList.add('playing');
                
                const audioFile = `audios/${currentTheme}_${word.en.toLowerCase().replace(/\s+/g, '_')}.wav`;
                const audio = new Audio(audioFile);
                
                audio.onended = () => {
                    index++;
                    setTimeout(playNext, 800); // 间隔800ms
                };
                
                audio.onerror = () => {
                    index++;
                    setTimeout(playNext, 800);
                };
                
                audio.play();
                index++;
            }
            
            playNext();
        }
        
        // 页面加载完成
        window.onload = () => {
            initThemes();
        };
    </script>
