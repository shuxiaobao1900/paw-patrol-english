<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汪汪队英语大冒险 - Paw Patrol English Adventure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);

            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);

            font-size: 1.2rem;

            margin: 0 auto;
            line-height: 1.6;
        }

            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .theme-card {
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 4px solid transparent;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }
        .theme-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-color: rgba(255,255,255,0.5);
        }
        .theme-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-card p {
            margin-bottom: 15px;
            line-height: 1.5;
            opacity: 0.95;
        }
        .word-count {
            background: rgba(255,255,255,0.3);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }
        .word-view {
            display: none;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            margin-top: 30px;
        }
        .word-view.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 15px;
        }
        .word-header h2 {
            color: #FF6B6B;
            font-size: 2rem;
        }
        .back-btn {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #FF5252;
            transform: scale(1.05);
        }
        .word-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
        }
        .word-card h3 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .word-card p {
            font-size: 1.5rem;
            opacity: 0.9;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .speech-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .speech-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .speech-btn.chinese {
            background: #2196F3;
        }
        .speech-btn.chinese:hover {
            background: #0b7dda;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 20px;
        }
        .nav-btn {
            background: #FF9800;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            flex: 1;
            max-width: 200px;
        }
        .nav-btn:hover {
            background: #F57C00;
            transform: scale(1.05);
        }
        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .progress {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 1.1rem;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        @media (max-width: 768px) {
            .theme-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));

            }
            .header h1 {

            }
            .word-card h3 {

            .controls {

            .speech-btn {

            }
            .word-header {

                align-items: flex-start;
            }
            .back-btn {

</head>
<body>
    <div class="container">
        <!-- 主页 - 主题选择 -->
        <div class="header">

    <script>
        // 单词数据
        const wordsData = [{"name": "🐾 动物世界", "category": "animals", "description": "学习16个动物世界相关单词", "color": "#FF6B6B", "words": [{"english": "Cat", "chinese": "猫", "emoji": "🐱", "sound": "meow"}, {"english": "Dog", "chinese": "狗", "emoji": "🐶", "sound": "woof"}, {"english": "Bird", "chinese": "鸟", "emoji": "🐦", "sound": "tweet"}, {"english": "Fish", "chinese": "鱼", "emoji": "🐟", "sound": "blub"}, {"english": "Rabbit", "chinese": "兔子", "emoji": "🐰", "sound": "hop"}, {"english": "Elephant", "chinese": "大象", "emoji": "🐘", "sound": "trumpet"}, {"english": "Bear", "chinese": "熊", "emoji": "🐻", "sound": "roar"}, {"english": "Panda", "chinese": "熊猫", "emoji": "🐼", "sound": "nom"}, {"english": "Lion", "chinese": "狮子", "emoji": "🦁", "sound": "roar"}, {"english": "Tiger", "chinese": "老虎", "emoji": "🐯", "sound": "roar"}, {"english": "Monkey", "chinese": "猴子", "emoji": "🐵", "sound": "ooh"}, {"english": "Zebra", "chinese": "斑马", "emoji": "🦓", "sound": "bray"}, {"english": "Duck", "chinese": "鸭子", "emoji": "🦆", "sound": "quack"}, {"english": "Chicken", "chinese": "鸡", "emoji": "🐔", "sound": "cluck"}, {"english": "Cow", "chinese": "奶牛", "emoji": "🐄", "sound": "moo"}, {"english": "Horse", "chinese": "马", "emoji": "🐴", "sound": "neigh"}]}, {"name": "🍎 水果乐园", "category": "fruits", "description": "学习16个水果乐园相关单词", "color": "#43e97b", "words": [{"english": "Apple", "chinese": "苹果", "emoji": "🍎", "sound": ""}, {"english": "Banana", "chinese": "香蕉", "emoji": "🍌", "sound": ""}, {"english": "Orange", "chinese": "橙子", "emoji": "🍊", "sound": ""}, {"english": "Grape", "chinese": "葡萄", "emoji": "🍇", "sound": ""}, {"english": "Watermelon", "chinese": "西瓜", "emoji": "🍉", "sound": ""}, {"english": "Strawberry", "chinese": "草莓", "emoji": "🍓", "sound": ""}, {"english": "Pineapple", "chinese": "菠萝", "emoji": "🍍", "sound": ""}, {"english": "Mango", "chinese": "芒果", "emoji": "🥭", "sound": ""}, {"english": "Peach", "chinese": "桃子", "emoji": "🍑", "sound": ""}, {"english": "Pear", "chinese": "梨", "emoji": "🍐", "sound": ""}, {"english": "Blueberry", "chinese": "蓝莓", "emoji": "🫐", "sound": ""}, {"english": "Cherry", "chinese": "樱桃", "emoji": "🍒", "sound": ""}, {"english": "Kiwi", "chinese": "猕猴桃", "emoji": "🥝", "sound": ""}, {"english": "Lemon", "chinese": "柠檬", "emoji": "🍋", "sound": ""}, {"english": "Avocado", "chinese": "牛油果", "emoji": "🥑", "sound": ""}, {"english": "Coconut", "chinese": "椰子", "emoji": "🥥", "sound": ""}]}, {"name": "🎨 颜色认知", "category": "colors", "description": "学习12个颜色认知相关单词", "color": "#667eea", "words": [{"english": "Red", "chinese": "红色", "emoji": "🔴", "sound": ""}, {"english": "Blue", "chinese": "蓝色", "emoji": "🔵", "sound": ""}, {"english": "Yellow", "chinese": "黄色", "emoji": "🟡", "sound": ""}, {"english": "Green", "chinese": "绿色", "emoji": "🟢", "sound": ""}, {"english": "Orange", "chinese": "橙色", "emoji": "🟠", "sound": ""}, {"english": "Purple", "chinese": "紫色", "emoji": "🟣", "sound": ""}, {"english": "Pink", "chinese": "粉色", "emoji": "🌸", "sound": ""}, {"english": "Black", "chinese": "黑色", "emoji": "⚫", "sound": ""}, {"english": "White", "chinese": "白色", "emoji": "⚪", "sound": ""}, {"english": "Brown", "chinese": "棕色", "emoji": "🟤", "sound": ""}, {"english": "Gray", "chinese": "灰色", "emoji": "🔘", "sound": ""}, {"english": "Gold", "chinese": "金色", "emoji": "✨", "sound": ""}]}, {"name": "🔢 数字王国", "category": "numbers", "description": "学习12个数字王国相关单词", "color": "#fa709a", "words": [{"english": "One", "chinese": "一", "emoji": "1️⃣", "sound": ""}, {"english": "Two", "chinese": "二", "emoji": "2️⃣", "sound": ""}, {"english": "Three", "chinese": "三", "emoji": "3️⃣", "sound": ""}, {"english": "Four", "chinese": "四", "emoji": "4️⃣", "sound": ""}, {"english": "Five", "chinese": "五", "emoji": "5️⃣", "sound": ""}, {"english": "Six", "chinese": "六", "emoji": "6️⃣", "sound": ""}, {"english": "Seven", "chinese": "七", "emoji": "7️⃣", "sound": ""}, {"english": "Eight", "chinese": "八", "emoji": "8️⃣", "sound": ""}, {"english": "Nine", "chinese": "九", "emoji": "9️⃣", "sound": ""}, {"english": "Ten", "chinese": "十", "emoji": "🔟", "sound": ""}, {"english": "Eleven", "chinese": "十一", "emoji": "1️⃣1️⃣", "sound": ""}, {"english": "Twelve", "chinese": "十二", "emoji": "1️⃣2️⃣", "sound": ""}]}, {"name": "👦 身体部位", "category": "body", "description": "学习12个身体部位相关单词", "color": "#FFB655", "words": [{"english": "Head", "chinese": "头", "emoji": "👦", "sound": ""}, {"english": "Eye", "chinese": "眼睛", "emoji": "👁️", "sound": ""}, {"english": "Ear", "chinese": "耳朵", "emoji": "👂", "sound": ""}, {"english": "Nose", "chinese": "鼻子", "emoji": "👃", "sound": ""}, {"english": "Mouth", "chinese": "嘴", "emoji": "👄", "sound": ""}, {"english": "Hand", "chinese": "手", "emoji": "✋", "sound": ""}, {"english": "Foot", "chinese": "脚", "emoji": "🦶", "sound": ""}, {"english": "Arm", "chinese": "胳膊", "emoji": "💪", "sound": ""}, {"english": "Leg", "chinese": "腿", "emoji": "🦵", "sound": ""}, {"english": "Face", "chinese": "脸", "emoji": "😊", "sound": ""}, {"english": "Hair", "chinese": "头发", "emoji": "💇", "sound": ""}, {"english": "Teeth", "chinese": "牙齿", "emoji": "🦷", "sound": ""}]}, {"name": "🚗 交通工具", "category": "vehicles", "description": "学习12个交通工具相关单词", "color": "#66CCFF", "words": [{"english": "Car", "chinese": "汽车", "emoji": "🚗", "sound": ""}, {"english": "Bus", "chinese": "公交车", "emoji": "🚌", "sound": ""}, {"english": "Train", "chinese": "火车", "emoji": "🚂", "sound": ""}, {"english": "Bike", "chinese": "自行车", "emoji": "🚲", "sound": ""}, {"english": "Plane", "chinese": "飞机", "emoji": "✈️", "sound": ""}, {"english": "Boat", "chinese": "船", "emoji": "🚢", "sound": ""}, {"english": "Ship", "chinese": "轮船", "emoji": "🚢", "sound": ""}, {"english": "Truck", "chinese": "卡车", "emoji": "🚚", "sound": ""}, {"english": "Motorcycle", "chinese": "摩托车", "emoji": "🏍️", "sound": ""}, {"english": "Taxi", "chinese": "出租车", "emoji": "🚕", "sound": ""}, {"english": "Subway", "chinese": "地铁", "emoji": "🚇", "sound": ""}, {"english": "Ambulance", "chinese": "救护车", "emoji": "🚑", "sound": ""}]}, {"name": "🍔 美味食物", "category": "food", "description": "学习12个美味食物相关单词", "color": "#FF7F50", "words": [{"english": "Bread", "chinese": "面包", "emoji": "🍞", "sound": ""}, {"english": "Milk", "chinese": "牛奶", "emoji": "🥛", "sound": ""}, {"english": "Egg", "chinese": "鸡蛋", "emoji": "🥚", "sound": ""}, {"english": "Cake", "chinese": "蛋糕", "emoji": "🍰", "sound": ""}, {"english": "Rice", "chinese": "米饭", "emoji": "🍚", "sound": ""}, {"english": "Noodle", "chinese": "面条", "emoji": "🍜", "sound": ""}, {"english": "Hamburger", "chinese": "汉堡", "emoji": "🍔", "sound": ""}, {"english": "Pizza", "chinese": "披萨", "emoji": "🍕", "sound": ""}, {"english": "Chocolate", "chinese": "巧克力", "emoji": "🍫", "sound": ""}, {"english": "Ice Cream", "chinese": "冰淇淋", "emoji": "🍦", "sound": ""}, {"english": "Candy", "chinese": "糖果", "emoji": "🍬", "sound": ""}, {"english": "Cookie", "chinese": "饼干", "emoji": "🍪", "sound": ""}]}, {"name": "👨‍👩‍👧 家庭成员", "category": "family", "description": "学习10个家庭成员相关单词", "color": "#9370DB", "words": [{"english": "Mom", "chinese": "妈妈", "emoji": "👩", "sound": ""}, {"english": "Dad", "chinese": "爸爸", "emoji": "👨", "sound": ""}, {"english": "Brother", "chinese": "兄弟", "emoji": "👦", "sound": ""}, {"english": "Sister", "chinese": "姐妹", "emoji": "👧", "sound": ""}, {"english": "Grandpa", "chinese": "爷爷", "emoji": "👴", "sound": ""}, {"english": "Grandma", "chinese": "奶奶", "emoji": "👵", "sound": ""}, {"english": "Baby", "chinese": "宝宝", "emoji": "👶", "sound": ""}, {"english": "Me", "chinese": "我", "emoji": "👧", "sound": ""}, {"english": "Friend", "chinese": "朋友", "emoji": "👫", "sound": ""}, {"english": "Teacher", "chinese": "老师", "emoji": "👩‍🏫", "sound": ""}]}];
        // 状态管理
        let currentThemeIndex = -1;
        let currentWordIndex = 0;
        let currentWords = [];
        // 初始化主题网格
        function initThemes() {
            const themeGrid = document.getElementById('themeGrid');
            themeGrid.innerHTML = '';
            wordsData.forEach((theme, index) => {
                const card = document.createElement('div');
                card.className = 'theme-card';
                const baseColor = theme.color || '#667eea';
                card.style.background = `linear-gradient(135deg, ${baseColor} 0%, ${adjustBrightness(baseColor, -40)} 100%)`;
                card.innerHTML = `
                    <h3>${theme.name}</h3>
                    <p>${theme.description || '快来学习这些有趣的单词吧！'}</p>
                    <span class="word-count">${theme.words.length} 个单词</span>
                `;
                card.onclick = () => selectTheme(index);
                themeGrid.appendChild(card);
            });
        }
        // 颜色调整函数
        function adjustBrightness(hex, percent) {
            let num = parseInt(hex.replace("#",""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            G = (num >> 8 & 0x00FF) + amt,
            B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }
        // 选择主题
        function selectTheme(index) {
            currentThemeIndex = index;
            currentWordIndex = 0;
            currentWords = wordsData[index].words;
            document.getElementById('themeGrid').style.display = 'none';
            document.getElementById('wordView').classList.add('active');
            document.getElementById('currentTheme').textContent = wordsData[index].name;
            updateWordDisplay();
        }
        // 返回主页
        function goHome() {
            document.getElementById('themeGrid').style.display = 'grid';
            document.getElementById('wordView').classList.remove('active');
        }
        // 更新单词显示
        function updateWordDisplay() {
            if (currentWords.length === 0) return;
            const word = currentWords[currentWordIndex];
            document.getElementById('currentWord').textContent = word.english;
            document.getElementById('currentTranslation').textContent = word.chinese;
            document.getElementById('progressText').textContent = 
                `进度：${currentWordIndex + 1}/${currentWords.length}`;
            const progressPercent = ((currentWordIndex + 1) / currentWords.length) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('prevBtn').disabled = currentWordIndex === 0;
            document.getElementById('nextBtn').disabled = currentWordIndex === currentWords.length - 1;
        }
        // 播放英语发音
        function playEnglish() {
            if (currentWords.length === 0) return;
            const word = currentWords[currentWordIndex];
            speak(word.english, 'en-US', 1.0, 1.2);
        }
        // 播放中文发音
        function playChinese() {
            if (currentWords.length === 0) return;
            const word = currentWords[currentWordIndex];
            speak(word.chinese, 'zh-CN', 0.9, 1.1);
        }
        // 语音合成
        function speak(text, lang, rate = 1.0, pitch = 1.0) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.pitch = pitch;
                utterance.volume = 1.0;
                const voices = speechSynthesis.getVoices();
                const femaleVoices = voices.filter(v => v.lang.includes(lang) && v.name.includes('Female'));
                if (femaleVoices.length > 0) {
                    utterance.voice = femaleVoices[0];
                }
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能，请使用 Chrome 或 Edge 浏览器。');
            }
        }
        // 上一个单词
        function prevWord() {
            if (currentWordIndex > 0) {
                currentWordIndex--;
                updateWordDisplay();
                setTimeout(() => playEnglish(), 300);
            }
        }
        // 下一个单词
        function nextWord() {
            if (currentWordIndex < currentWords.length - 1) {
                currentWordIndex++;
                updateWordDisplay();
                setTimeout(() => playEnglish(), 300);
            }
        }
        // 初始化
        window.onload = function() {
            initThemes();
            if ('speechSynthesis' in window) {
                speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
